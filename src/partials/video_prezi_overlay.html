<div class=" hidden md:block fixed right-4 bottom-4 z-50 transition-all duration-300" style="width: 180px; height: 180px;">
    <div class="relative w-full h-full overflow-hidden rounded-full shadow-lg">
        <video id="preziVideo" class="w-full h-full rounded-full" loop muted playsinline preload="metadata" webkit-playsinline="true"
            style="object-fit: cover; width: 100%; height: 100%; display: block; position: absolute; top: 0; left: 0;">
            <source src="/assets/intro_video_ingenia_en_cropped_720p.mp4" type="video/mp4">
            Votre navigateur ne supporte pas la lecture vidéo.
        </video>
        


        <!-- Restart button (center, lowest) -->
        <button data-video-control="restart"
            class="absolute bottom-4 right-10   flex items-center justify-center w-7 h-7 rounded-full bg-black/60 hover:bg-black/80 text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/50 shadow-lg"
            aria-label="Recommencer">
            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
            </svg>
        </button>
        <!-- Control buttons following circle contour -->
        <!-- Play/Pause button (left, elevated) -->
        <button data-video-control="play-pause" 
            class="absolute  bottom-2 left-1/2 -translate-x-1/2 flex items-center justify-center w-7 h-7 rounded-full bg-black/60 hover:bg-black/80 text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/50 shadow-lg"
            aria-label="Lecture/Pause">
            <svg data-icon="pause" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="14" y="4" width="4" height="16" rx="1"></rect>
                <rect x="6" y="4" width="4" height="16" rx="1"></rect>
            </svg>
            <svg data-icon="play" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="6 3 20 12 6 21 6 3"></polygon>
            </svg>
        </button>
        <!-- Mute button (right, elevated) -->
        <button data-video-control="mute"
            class="absolute bottom-4 left-10 flex items-center justify-center w-7 h-7 rounded-full bg-black/60 hover:bg-black/80 text-white transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-white/50 shadow-lg"
            aria-label="Son">
            <svg data-icon="muted" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
                <line x1="22" x2="16" y1="9" y2="15"></line>
                <line x1="16" x2="22" y1="9" y2="15"></line>
            </svg>
            <svg data-icon="unmuted" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z"></path>
                <path d="M15.5 8.5a5 5 0 0 1 0 7"></path>
                <path d="M18 5a9 9 0 0 1 0 14"></path>
            </svg>
        </button>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const videoEl = document.querySelector('#preziVideo');
    if (!videoEl) return;

    const controls = {
        playPause: document.querySelector('[data-video-control="play-pause"]'),
        restart: document.querySelector('[data-video-control="restart"]'),
        mute: document.querySelector('[data-video-control="mute"]')
    };

    const icons = {
        pause: controls.playPause?.querySelector('[data-icon="pause"]'),
        play: controls.playPause?.querySelector('[data-icon="play"]'),
        muted: controls.mute?.querySelector('[data-icon="muted"]'),
        unmuted: controls.mute?.querySelector('[data-icon="unmuted"]')
    };

    const toggleIcon = (showIcon, hideIcon) => {
        hideIcon?.classList.add('hidden');
        showIcon?.classList.remove('hidden');
    };

    const handlePlayPause = () => {
        if (videoEl.paused) {
            videoEl.play();
            toggleIcon(icons.pause, icons.play);
        } else {
            videoEl.pause();
            toggleIcon(icons.play, icons.pause);
        }
    };

    const handleRestart = () => {
        videoEl.currentTime = 0;
        if (videoEl.paused) {
            videoEl.play();
            toggleIcon(icons.pause, icons.play);
        }
    };

    const handleMuteToggle = () => {
        videoEl.muted = !videoEl.muted;
        toggleIcon(
            videoEl.muted ? icons.muted : icons.unmuted,
            videoEl.muted ? icons.unmuted : icons.muted
        );
    };

    controls.playPause?.addEventListener('click', handlePlayPause);
    controls.restart?.addEventListener('click', handleRestart);
    controls.mute?.addEventListener('click', handleMuteToggle);

    videoEl.play().catch(() => {});
});
</script>
