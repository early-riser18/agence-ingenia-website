<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Agent Demo — Ingenia Agency</title>
  <meta name="description" content="Watch our AI agent handle commercial proposal requests end-to-end.">
  <meta name="robots" content="noindex, nofollow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Epilogue:wght@400;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/output.css">

  <link rel="icon" type="image/png" href="/assets/favicon/favicon-96x96.png" sizes="96x96">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon/favicon.svg">
  <link rel="shortcut icon" href="/assets/favicon/favicon.ico">
</head>
<body style="background-color: #f8f8f8; font-family: 'DM Sans', sans-serif; color: #2c2c2c; margin: 0;">

  <!-- Minimal header -->
  <header class="sticky top-0 z-50 bg-white/90 backdrop-blur border-b border-gray-200">
    <div class="max-w-screen-xl mx-auto px-6 py-4 flex items-center justify-between">
      <a href="/" class="flex items-center gap-2.5" aria-label="Back to home">
        <img src="/assets/ingenia_logo_base.png" alt="Ingenia" class="h-7 w-auto">
        <span class="font-semibold tracking-wider">INGENIA</span>
      </a>
      <a href="/" class="text-sm font-medium text-gray-500 hover:text-primary transition-colors flex items-center gap-1.5">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Back to site
      </a>
    </div>
  </header>

  <!-- Main content -->
  <main class="mx-auto px-4 sm:px-6 py-8 sm:py-10 max-w-screen-lg">

    <!-- Title block -->
    <div class="mb-6 sm:mb-8">
      <h1 style="font-family: 'Epilogue', sans-serif; font-size: clamp(1.5rem, 1rem + 2vw, 2.25rem); font-weight: 600; color: #2c2c2c; line-height: 1.15; margin: 0 0 12px 0;">
        AI Agent Demo
      </h1>
      <p class="text-gray-500 text-base leading-relaxed" style="margin: 0;">
        Handling commercial proposal requests end-to-end, from first contact to final reply.
      </p>
    </div>

    <!-- Video player (Loom embed) - container sized to match 16:9 and viewport -->
    <div class="rounded-2xl overflow-hidden shadow-xl bg-black mx-auto" style="position: relative; width: 100%; padding-bottom: 56.25%; height: 0;">
      <iframe
        src="https://www.loom.com/embed/340bb310ad7347d0b4505027dc46cfb2"
        frameborder="0"
        allowfullscreen
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
      ></iframe>
    </div>

    <!-- Below-video nudge -->
    <div class="mt-8 flex py-3 flex-col sm:flex-row items-start sm:items-center justify-between gap-4 pt-6 border-t border-gray-200">
      <p class="text-sm text-gray-500">
        Want to discuss what this could look like for your business?
      </p>
      <a href="https://agence-ingenia.com/#contact" class="btn-primary rounded-xl px-6 py-2.5 text-sm font-semibold whitespace-nowrap">
        Book a free audit
      </a>
    </div>

  </main>

  <!-- Minimal footer -->
  <footer class="mt-12 border-t border-slate-200 bg-white">
    <div class="max-w-screen-xl mx-auto px-6 py-8 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm text-slate-500">
      <div class="flex items-center gap-2">
        <img src="/assets/ingenia_logo_base.png" alt="Ingenia" class="h-5 w-auto">
        <span class="font-semibold tracking-wide text-slate-700">INGENIA</span>
      </div>
      <p>Modernizing your business with AI is within your reach.</p>
      <a href="/" class="hover:text-primary transition-colors">agence-ingenia.com</a>
    </div>
  </footer>

</body>
</html>
