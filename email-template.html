<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Your demo is ready &mdash; Ingenia Agency</title>
  <!--[if mso]>
  <noscript>
    <xml>
      <o:OfficeDocumentSettings>
        <o:PixelsPerInch>96</o:PixelsPerInch>
      </o:OfficeDocumentSettings>
    </xml>
  </noscript>
  <![endif]-->
</head>
<body style="margin: 0; padding: 0; background-color: #f8f8f8; font-family: 'DM Sans', Arial, Helvetica, sans-serif; font-size: 16px; line-height: 1.5; color: #2c2c2c; -webkit-text-size-adjust: 100%;">
  <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="background-color: #f8f8f8;">
    <tr>
      <td align="center" style="padding: 32px 16px;">
        <!-- Container: max 600px for email readability -->
        <table role="presentation" cellspacing="0" cellpadding="0" border="0" width="100%" style="max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);">

          <!-- Header with logo -->
          <tr>
            <td style="padding: 32px 32px 24px 32px; text-align: center; border-bottom: 1px solid #e5e7eb;">
              <a href="https://agence-ingenia.com" target="_blank" style="text-decoration: none;">
                <img src="https://agence-ingenia.com/assets/fill_ingenia_logo.png" alt="Ingenia Agency" width="80" height="auto" style="display: inline-block; max-width: 160px; height: auto; border: 0; outline: none;" />
              </a>
              <p style="margin: 12px 0 0 0; font-size: 14px; color: #6b7280; font-weight: 500;">AI automation for your business</p>
            </td>
          </tr>

          <!-- Main content -->
          <tr>
            <td style="padding: 32px;">
              <h1 style="margin: 0 0 16px 0; font-family: 'Epilogue', Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 600; color: #2c2c2c; line-height: 1.25;">
                Here's your demo link
              </h1>
              <p style="margin: 0 0 24px 0; font-size: 16px; color: #2c2c2c; line-height: 1.6;">
                Thanks for requesting it. Click below to watch the full demo of our AI agent in action.
              </p>
              <!-- CTA button -->
              <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="margin: 8px 0 0 0;">
                <tr>
                  <td style="border-radius: 8px; background-color: #4ab685;">
                    <a href="https://agence-ingenia.com/demo" target="_blank" style="display: inline-block; padding: 14px 28px; font-size: 16px; font-weight: 600; color: #ffffff; text-decoration: none; font-family: 'DM Sans', Arial, Helvetica, sans-serif;">
                      Watch the demo
                    </a>
                  </td>
                </tr>
              </table>
              <!-- Plain link fallback -->
              <p style="margin: 20px 0 0 0; font-size: 14px; color: #6b7280;">
                If the button does not work, copy this link:
                <a href="https://agence-ingenia.com/demo" style="color: #4ab685; text-decoration: underline;">https://agence-ingenia.com/demo</a>
              </p>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding: 24px 32px 32px 32px; text-align: center; border-top: 1px solid #e5e7eb;">
              <p style="margin: 0; font-size: 13px; color: #9ca3af;">
                Ingenia Agency
              </p>
              <p style="margin: 8px 0 0 0; font-size: 12px;">
                <a href="https://agence-ingenia.com" style="color: #4ab685; text-decoration: none;">agence-ingenia.com</a>
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
