<!DOCTYPE html>

<html lang="en">
    <head>
        <script>
            fetch('https://ipapi.co/json/')
                .then(response => response.json())
                .then(data => {

                    if (data.country_code === 'FR') {
                        window.location.href = '/fr/';
                    } else {
                        window.location.href = '/en/';
                    }
                })
                .catch(() => {
                    // Fallback to English if geolocation fails
                    window.location.href = '/en/';
                });
        </script>
    </head>
    <body>
        <p>Redirecting...</p>
    </body>
</html>
